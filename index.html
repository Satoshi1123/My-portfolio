     labels: ['国内株式（現物）', '投資信託', '外国株式'],
     values: [0, 0, 0]
 };

 var ctx1 = document.getElementById('chart1').getContext('2d');
 var myChart = new Chart(ctx1, {
     type: 'line', // グラフの種類 line,bar,pie,
     data: {
         labels: chartLabels, // X軸のラベル
         datasets: [{
             label: '損益推移（週間）',
             data: [11,153,399,882,6,-515,128,2089,1140,2337,2675,-721,489,-6974,-1544,-406,-241,4027,531,4872,5496,3456,5359,-590,-3246], // Y軸のデータ
            backgroundColor: 'rgba(0, 0, 0, 0.5)', // 塗りつぶし色
            borderWidth: 2, // 線の太さ
            cubicInterpolationMode: 'monotone',  // ★ここがポイント
            tension: 0.4,                       // 滑らかさ
            pointRadius: 3,
             segment: {
                borderColor : function(context){
                    const prev = context.p0.parsed.y;
                    const current = context.p1.parsed.y;

                    if (current > prev){
                        return 'rgb(255, 99,132)';
                    } else if (current < prev){
                        return 'rgb(54,162, 235)';
                    }else {
                        return 'rgb(200, 200, 200)';
                    }
                    }
                    }
                }]
     },// 線の色
     options: {
         responsive: true, //画面サイズに自動で合わせる
         plugins: {
             legend: {
                 display: true,
                 position: 'top'
             },
             title: {
                 display: true,
                 text: 'グラフ1',
                 font: {
                    size: 30
                 },
             },
         },
         onClick: function(event, elements) {
             if (!elements.length) {
                 return;
             }

             const selectedIndex = elements[0].index;
             const selectedDate = chartLabels[selectedIndex];
             const selectedBreakdown = breakdownByDate[selectedDate] || emptyBreakdown;
             myPieChart.data.labels = selectedBreakdown.labels;
             myPieChart.data.datasets[0].data = selectedBreakdown.values;
             myPieChart.options.plugins.title.text = `${selectedDate} の内訳（円）`;
             myPieChart.update();
         },
         scales: {
            x: {
                display:true,
                title:{
                    display:true
                }
            },
            y: {
                display:true,
                title: {
                    display:true,
                    text:'損益'
                },
                suggestedMin: -8000,
                suggestedMax: 6000
             }
         }
     },
 });

<h1 class="subtitle">投資の内訳</h1>
<canvas id="myPieChart"></canvas>
<script>
 const ctx2 = document.getElementById('myPieChart').getContext('2d');
 const myPieChart = new Chart(ctx2, {
    type: 'pie',
    data: {
        labels: (breakdownByDate[chartLabels[0]] || emptyBreakdown).labels,
        datasets: [{
            data: (breakdownByDate[chartLabels[0]] || emptyBreakdown).values,
            backgroundColor: 
            ['#5ccb9e','#1b6ce3','#ee82da'],
            borderWidth: 1
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend:{
                position: 'top',
            },
            title:{
                display: true,
                text:`${chartLabels[0]} の内訳（円）`
            }
        }
    }
 });

</script>
